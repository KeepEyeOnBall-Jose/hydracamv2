name: Flutter Quality

on:
  workflow_dispatch:
    inputs:
      runner_label:
        description: Optional admitted repository runner label
        type: string
        required: false
  pull_request:
  push:
    branches: [master-jose-2025]

jobs:
  flutter-quality:
    runs-on: ${{ github.repository_owner == 'KeepEyeOnBall-Jose' && github.event.repository.private && github.actor == github.repository_owner && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && (inputs.runner_label || fromJSON(vars.CI_LINUX_RUNNER_LABELS || '["keob-linux-ci","repo-hydracamv2"]')) || 'ubuntu-latest' }}
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true

      - name: flutter pub get
        run: flutter pub get

      # Scoped to lib/test/tool/integration_test (matches scripts/agent_gate.sh's
      # changed-file dart-format check). Verified clean locally on the full tree
      # including generated lib/l10n/*.dart at the time this gate was added, so
      # the scope is a safety margin against future generated-file drift rather
      # than evidence of an existing problem.
      - name: dart format --set-exit-if-changed
        run: dart format --output=none --set-exit-if-changed lib test tool integration_test

      - name: flutter analyze
        run: flutter analyze --no-pub

      - name: flutter test
        run: flutter test --no-pub
