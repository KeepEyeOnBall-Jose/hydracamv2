name: Flutter Quality

on:
  pull_request:
  push:
    branches: [master-jose-2025]

jobs:
  flutter-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true

      # subosito/flutter-action's `cache: true` caches the SDK, not the package
      # downloads, so `flutter pub get` re-fetches every dependency each run.
      # ~/.pub-cache is outside the workspace, so actions/checkout's default
      # `git clean -ffdx` does not reach it.
      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            pub-${{ runner.os }}-

      - name: flutter pub get
        run: flutter pub get

      # Scoped to lib/test/tool/integration_test (matches scripts/agent_gate.sh's
      # changed-file dart-format check). Verified clean locally on the full tree
      # including generated lib/l10n/*.dart at the time this gate was added, so
      # the scope is a safety margin against future generated-file drift rather
      # than evidence of an existing problem.
      - name: dart format --set-exit-if-changed
        run: dart format --output=none --set-exit-if-changed lib test tool integration_test

      - name: flutter analyze
        run: flutter analyze --no-pub

      - name: flutter test
        run: flutter test --no-pub
