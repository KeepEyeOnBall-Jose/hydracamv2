import java.io.FileInputStream
import java.util.Locale
import java.util.Properties

plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "dev.flutter.flutter-gradle-plugin"
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("key.properties")
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

def releaseStoreFilePath = keystoreProperties["storeFile"]?.toString()
def releaseStoreFile = releaseStoreFilePath
    ? (new File(releaseStoreFilePath).isAbsolute()
        ? file(releaseStoreFilePath)
        : rootProject.file(releaseStoreFilePath))
    : null
def hasReleaseKeystore =
    keystorePropertiesFile.exists() &&
    keystoreProperties["storeFile"] &&
    releaseStoreFile?.exists()
def hydracamNdkVersion =
    (project.findProperty("hydracamNdkVersion") ?: "28.2.13676358").toString()
// Gated Meta DAT wearable-bridge seam. Default (flavorless) builds compile the
// stub source set so the mock/fallback Ray-Ban POV path is unchanged and the
// wearable-replay dependency-boundary check stays green. Pass
// `-PwithMetaDat=true` to compile the real bridge source set instead; the
// developer-preview Meta DAT SDK is intentionally NOT added as a dependency
// here yet — that lands in the dedicated physical DAT integration step.
def withMetaDat =
    (project.findProperty("withMetaDat") ?: "false").toString().toBoolean()
// Opt-in court runtime (K1) flavor, `com.amaia23.hydracam.court`. Hand-held
// builds stay flavorless so their APK paths and cross-platform `flutter run`
// commands are unchanged (iOS/macOS have no matching schemes). The flavor exists
// when building the court Dart entrypoint, or with `-PhydracamCourt=true` for
// Gradle-only tasks such as `testCourtDebugUnitTest`:
//   flutter build apk --debug --flavor court -t lib/court/main_court.dart
def hydracamCourt =
    (project.findProperty("hydracamCourt") ?: "false").toString().toBoolean() ||
        (project.findProperty("target") ?: "").toString()
            .replace("\\", "/")
            .contains("lib/court/")
if (hydracamCourt) {
    apply plugin: "com.google.devtools.ksp"
    // Court quality gate (scripts/court_quality_gate.sh). Hand-held builds never apply these.
    apply plugin: "org.jlleitschuh.gradle.ktlint"
    apply plugin: "io.gitlab.arturbosch.detekt"
    apply plugin: "org.jetbrains.kotlinx.kover"
}
def generatedPluginRegistrantFile = file(
    "src/main/java/io/flutter/plugins/GeneratedPluginRegistrant.java"
)

android {
    namespace = "com.amaia23.hydracam"
    compileSdk = 37
    ndkVersion = hydracamNdkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        buildConfig = true
    }

    // Match the vendored CameraX plugin's native test environment.
    testOptions {
        unitTests {
            includeAndroidResources = true
            returnDefaultValues = true
            all {
                outputs.upToDateWhen { false }
                testLogging {
                    events("passed", "skipped", "failed", "standardOut", "standardError")
                    showStandardStreams = true
                }
                jvmArgs("-Xmx1G")
            }
        }
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
        // Exactly one of these source sets is compiled. Both define
        // RealMetaPovBridgeFactory so src/main can reference it unconditionally.
        if (withMetaDat) {
            main.java.srcDirs += 'src/metaDatReal/kotlin'
        } else {
            main.java.srcDirs += 'src/metaDatStub/kotlin'
        }
        if (hydracamCourt) {
            court.java.srcDirs += 'src/court/kotlin'
            testCourt.java.srcDirs += 'src/testCourt/kotlin'
        }
    }

    if (hydracamCourt) {
        flavorDimensions "runtime"
        productFlavors {
            court {
                dimension "runtime"
                applicationId "com.amaia23.hydracam.court"
                manifestPlaceholders["appAuthRedirectScheme"] = "com.amaia23.hydracam.court"
                manifestPlaceholders["mwdatRedirectScheme"] = "com.amaia23.hydracam.court.mwdat"
            }
        }
    }

    defaultConfig {
        applicationId = "com.amaia23.hydracam"
        minSdkVersion = 24
        targetSdk = 36
        versionCode = flutter.versionCode.toInteger()
        versionName = flutter.versionName
        manifestPlaceholders["appAuthRedirectScheme"] = "com.amaia23.hydracam"
        manifestPlaceholders["mwdatRedirectScheme"] = "com.amaia23.hydracam.mwdat"
        manifestPlaceholders["mwdatApplicationId"] = "0"
        buildConfigField "boolean", "META_DAT_BRIDGE", "${withMetaDat}"
    }

    signingConfigs {
        release {
            if (hasReleaseKeystore) {
                keyAlias = keystoreProperties["keyAlias"]
                keyPassword = keystoreProperties["keyPassword"]
                storeFile = releaseStoreFile
                storePassword = keystoreProperties["storePassword"]
            }
        }
    }

    buildTypes {
        release {
            signingConfig = signingConfigs.release
        }
    }
}

gradle.taskGraph.whenReady { taskGraph ->
    def releaseBuildRequested = taskGraph.allTasks.any { task ->
        def taskName = task.name.toLowerCase(Locale.ROOT)
        taskName.contains("release") &&
            (taskName.contains("bundle") ||
                taskName.contains("assemble") ||
                taskName.contains("package"))
    }
    if (releaseBuildRequested && !hasReleaseKeystore) {
        throw new GradleException(
            "Release build requires android/key.properties with a valid storeFile. " +
                "Debug signing is not allowed for store artifacts."
        )
    }
}

flutter {
    source = "../.."
}

dependencies {
    // Same CameraX version as packages/camera_android_camerax (manual exposure).
    def cameraxVersion = "1.6.2"
    implementation "androidx.camera:camera-core:${cameraxVersion}"
    implementation "androidx.camera:camera-camera2:${cameraxVersion}"
    // ListenableFuture for Camera2CameraControl; same version as the plugin.
    implementation "com.google.guava:guava:33.5.0-android"
    testImplementation "junit:junit:4.13.2"
    testImplementation "org.mockito:mockito-core:5.23.0"
    testImplementation "org.mockito:mockito-inline:5.2.0"
    testImplementation "androidx.test:core:1.7.0"
    testImplementation "org.robolectric:robolectric:4.16"
    if (hydracamCourt) {
        courtImplementation "androidx.core:core-ktx:1.13.1"
        courtImplementation "androidx.room:room-runtime:2.7.2"
        courtImplementation "com.squareup.okhttp3:okhttp:4.12.0"
        kspCourt "androidx.room:room-compiler:2.7.2"
        testCourtImplementation "com.squareup.okhttp3:mockwebserver:4.12.0"
        testCourtImplementation "org.json:json:20180813"
        // Validates the vendored court-contracts JSON Schema (draft 2020-12) in CourtContractsConformanceTest.
        testCourtImplementation "com.networknt:json-schema-validator:1.5.6"
    }
}

// Resource-backed unit tests package Flutter's debug assets. Declare their
// producer explicitly for Gradle 9's task output dependency validation.
tasks.configureEach { task ->
    if (task.name == "packageDebugUnitTestForUnitTest") {
        task.dependsOn("copyFlutterAssetsDebug")
    }
    if (task.name == "packageCourtDebugUnitTestForUnitTest") {
        task.dependsOn("copyFlutterAssetsCourtDebug")
    }
}

if (hydracamCourt) {
    ksp {
        arg("room.schemaLocation", "$projectDir/schemas")
    }

    ktlint {
        version = "1.7.1"
        // Court sources only: the hand-held Kotlin keeps its current style.
        filter {
            exclude { element -> !element.directory && !element.file.path.contains("/hydracam/court/") }
        }
    }

    detekt {
        source.setFrom(files("src/court/kotlin", "src/testCourt/kotlin"))
        config.setFrom(files("$rootDir/config/detekt/court.yml"))
        buildUponDefaultConfig = true
        parallel = true
    }

    // detekt 1.23.8 is built against Kotlin 2.0.21 and refuses to run on the app's 2.2 compiler.
    configurations.matching { it.name == "detekt" }.configureEach {
        resolutionStrategy.eachDependency { details ->
            if (details.requested.group == "org.jetbrains.kotlin") {
                details.useVersion("2.0.21")
            }
        }
    }

    kover {
        reports {
            filters {
                includes {
                    classes("com.amaia23.hydracam.court.*")
                }
                // These need a phone (Camera2, MediaCodec, Room, Keystore, su, services) and are verified
                // on device (logs/verification-runs/). Keep logic out of them so it stays JVM-tested.
                // Room's *_Impl classes are generated.
                excludes {
                    def deviceOnly = [
                        "AndroidCourtLogger",
                        "CourtActivity",
                        "CourtBootReceiver",
                        "CourtCameraRecorder",
                        "CourtCameraService",
                        "CourtDatabase",
                        "CourtEnrollReceiver",
                        "CourtRuntime",
                        "DeviceStatusProbe",
                        "KeystoreCredentialStore",
                        "PrefsActiveSessionStore",
                        "PrefsUploadPolicyStore",
                        "RoomUploadQueueStore",
                        "RootShell",
                        "ToneGeneratorPlayer",
                        "*_Impl",
                    ]
                    deviceOnly.each { name ->
                        classes("com.amaia23.hydracam.court.${name}", "com.amaia23.hydracam.court.${name}\$*")
                    }
                }
            }
            variant("courtDebug") {
                verify {
                    rule("court line and branch coverage") {
                        def percent = kotlinx.kover.gradle.plugin.dsl.AggregationType.COVERED_PERCENTAGE
                        minBound(90, kotlinx.kover.gradle.plugin.dsl.CoverageUnit.LINE, percent)
                        minBound(90, kotlinx.kover.gradle.plugin.dsl.CoverageUnit.BRANCH, percent)
                    }
                }
            }
        }
    }
}

tasks.withType(JavaCompile).configureEach { task ->
    if (task.name in ["compileReleaseJavaWithJavac", "compileCourtReleaseJavaWithJavac"]) {
        task.doFirst {
            // Flutter 3.44 generates dev-only integration_test registration, but
            // its Gradle plugin deliberately excludes dev dependencies from release.
            if (!generatedPluginRegistrantFile.exists()) {
                return
            }
            def registrant = generatedPluginRegistrantFile.getText("UTF-8")
            def strippedRegistrant = registrant.replaceAll(
                /(?s)\n    try \{\n      flutterEngine\.getPlugins\(\)\.add\(new dev\.flutter\.plugins\.integration_test\.IntegrationTestPlugin\(\)\);\n    \} catch \(Exception e\) \{\n      Log\.e\(TAG, "Error registering plugin integration_test, dev\.flutter\.plugins\.integration_test\.IntegrationTestPlugin", e\);\n    \}/,
                ""
            )
            if (strippedRegistrant != registrant) {
                generatedPluginRegistrantFile.write(strippedRegistrant, "UTF-8")
            }
        }
    }
}
