# HydraCam hybrid fleet definition (example).
# Copy to fleet.conf and edit. Used by scripts/hybrid_deploy.sh and
# scripts/clock-sync/run_clock_sync_capture.sh.
#
# MASTER_IP is the master *phone's* LAN IP (the Wi-Fi address slaves connect to
# over the master/slave WebSocket). All phones MUST be on the same Wi-Fi LAN for
# sync — the Macs only build/deploy/control over adb; the phones talk to each
# other directly. Find it on the master device:
#   adb -s <master-serial> shell ip route | awk '{print $9}'
MASTER_IP=192.168.178.50

# One line per device:  name  serial  host  role
#   host = "local" (adb on this Mac) or an SSH target (e.g. a Tailscale name like
#          joss-macbook-air) whose adb owns that device.
#   role = master | slave
# Exactly one master.
#
# Current fleet (2026-06-24):
s10e-glasses   RF8M21J8XRT          local              master
s7-edge        9885e6503930304946   joss-macbook-air   slave
s10e-b         RF8M90QE7LX          joss-macbook-air   slave
